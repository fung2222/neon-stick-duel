<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05010f">
<meta name="description" content="霓虹火柴人對決 NEON STICK DUEL — 單指 3D 賽博朋克火柴人格鬥，無盡天台塔。One-thumb 3D cyberpunk stick-figure duel with an endless rooftop tower.">
<title data-i18n="doc.title">NEON STICK DUEL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%2305010f%22/%3E%3Ccircle cx=%2212%22 cy=%227%22 r=%223%22 fill=%22none%22 stroke=%22%2300e5ff%22 stroke-width=%222%22/%3E%3Cpath d=%22M12 10v9l-4 8M12 19l4 8M12 13l8-2%22 fill=%22none%22 stroke=%22%2300e5ff%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2223%22 cy=%2211%22 r=%222.5%22 fill=%22%23ff2bd6%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/cyber-kit/ui/hud.css">
<link rel="stylesheet" href="./css/game.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/cyber-kit/three/three.module.min.js",
    "three/addons/": "./vendor/cyber-kit/three/addons/",
    "cyber-kit": "./vendor/cyber-kit/kit.js",
    "cyber-kit/": "./vendor/cyber-kit/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="fx-flash"></div>
<div id="scanlines"></div>

<div id="hud" class="hidden">
  <div class="vs-bar">
    <div class="fighter-hp me">
      <div class="fh-name"><b id="hp-name-a" data-i18n="you">你</b></div>
      <div class="fh-track"><div class="fh-lag" id="hp-lag-a"></div><div class="fh-fill" id="hp-fill-a"></div></div>
    </div>
    <div class="vs-mid"><div class="vs-floor" id="hud-floor">1F</div><div class="vs-time" id="hud-time">60</div></div>
    <div class="fighter-hp foe">
      <div class="fh-name"><b id="hp-name-b">練習木人</b><em id="hp-en-b">TRAINING DUMMY</em></div>
      <div class="fh-track"><div class="fh-lag" id="hp-lag-b"></div><div class="fh-fill" id="hp-fill-b"></div></div>
    </div>
  </div>
  <div class="score-line"><span id="hud-score">0</span> <small data-i18n="score">SCORE</small></div>
  <div id="combo" class="combo hidden"></div>
  <div id="gesture-bar" class="gesture-bar">
    <div class="g"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="5"/><circle cx="20" cy="20" r="12" class="thin"/></svg><b data-i18n="g.tap"></b><small data-i18n="g.tapS"></small></div>
    <div class="g"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" class="thin"/><path d="M20 7a13 13 0 0 1 13 13" class="arc"/><circle cx="20" cy="20" r="4"/></svg><b data-i18n="g.hold"></b><small data-i18n="g.holdS"></small></div>
    <div class="g"><svg viewBox="0 0 40 40"><path d="M12 22l8-9 8 9M12 31l8-9 8 9" class="line"/></svg><b data-i18n="g.up"></b><small data-i18n="g.upS"></small></div>
    <div class="g"><svg viewBox="0 0 40 40"><path d="M14 12l-8 8 8 8M26 12l8 8-8 8" class="line"/><path d="M11 20h18" class="line thin"/></svg><b data-i18n="g.side"></b><small data-i18n="g.sideS"></small></div>
    <div class="g"><svg viewBox="0 0 40 40"><path d="M20 6l11 5v8c0 7-5 12-11 15-6-3-11-8-11-15v-8z" class="line"/><path d="M15 19l4 4 7-8" class="line"/></svg><b data-i18n="g.down"></b><small data-i18n="g.downS"></small></div>
  </div>
  <div id="charge-ring" class="charge-ring hidden"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" class="bg"/><circle cx="50" cy="50" r="42" class="fg" id="charge-arc"/></svg></div>
  <div class="hud-buttons">
    <button id="btn-pause" class="icon-btn" data-i18n-attr="title:pauseTip,aria-label:pauseTip"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
    <button id="btn-mute" class="icon-btn" data-i18n-attr="title:muteTip,aria-label:muteTip">
      <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="2"/></svg>
    </button>
  </div>
  <div id="demo-tag" class="demo-tag hidden" data-i18n="kit.demo"></div>
  <div id="fps" class="fps hidden">-- FPS</div>
</div>

<div id="screen-start" class="screen hero">
  <div class="panel">
    <div class="kicker" data-i18n="kicker"></div>
    <h1 class="title glitch" id="title" data-i18n="title">霓虹火柴人</h1>
    <div class="title-en" data-i18n="titleEn"></div>
    <p class="tagline" data-i18n-html="tagline"></p>
    <button class="neon-btn" id="btn-start"><span id="start-label">登塔</span><small id="start-sub">CLIMB THE TOWER · ENTER</small></button>
    <button class="neon-btn ghost hidden" id="btn-restart-tower"><span data-i18n="newRun"></span><small data-i18n="newRunS"></small></button>
    <div class="controls">
      <div class="touch-hint" data-i18n="touchHint"></div>
      <div data-i18n-html="keysHint"></div>
    </div>
    <div class="hi-line"><span data-i18n="bestFloor"></span> <b id="start-floor">—</b>　<span data-i18n="bestScore"></span> <b id="start-best">0</b></div>
    <div class="link-row"><a href="./privacy.html" data-i18n="privacy"></a> · <button class="lang-btn" id="btn-lang"></button></div>
  </div>
</div>

<div id="screen-pause" class="screen hidden">
  <div class="panel small">
    <h2 class="title2 glitch" data-i18n="paused">已暫停</h2>
    <div class="title-en" data-i18n="pausedS"></div>
    <button class="neon-btn" id="btn-resume"><span data-i18n="resume"></span><small data-i18n="resumeS"></small></button>
    <button class="neon-btn ghost" id="btn-quit"><span data-i18n="quit"></span><small data-i18n="quitS"></small></button>
    <button class="lang-btn" id="btn-lang2"></button>
  </div>
</div>

<div id="screen-result" class="screen hidden">
  <div class="panel">
    <div class="kicker" id="res-kicker">FLOOR 1</div>
    <h2 class="title2 glitch" id="res-title" data-text="勝利！">勝利！</h2>
    <div class="title-en" id="res-en">K.O. VICTORY</div>
    <div id="res-record" class="newrecord hidden" data-i18n="kit.newRecord"></div>
    <div class="results" id="res-stats"></div>
    <button class="neon-btn" id="btn-res-main"><span id="res-main-zh">上一層</span><small id="res-main-en">NEXT FLOOR · ENTER</small></button>
    <button class="neon-btn hidden" id="btn-revive"><span data-i18n="revive"></span><small id="revive-sub"></small></button>
    <button class="neon-btn ghost" id="btn-res-menu"><span data-i18n="menu"></span><small data-i18n="menuS"></small></button>
  </div>
</div>

<div id="loading" class="loading"><div class="ld-text" data-i18n="loading">CHARGING NEON LIMBS…</div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
